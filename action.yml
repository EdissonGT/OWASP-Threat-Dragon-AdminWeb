name: repocheckup
description: Security, code quality, repository health and dependency checks with a score and an HTML report.
author: Edisson Payes
branding:
  icon: shield
  color: green
inputs:
  path:
    description: File or folder to analyze
    default: "."
  checks:
    description: "Comma-separated checks: security, quality, health, deps, or all. Empty uses the config file or the default."
    default: ""
  fail-on:
    description: "Fail if a finding of this severity or higher exists: low, medium, high, critical, never. Empty uses the config file or 'high'."
    default: ""
  min-score:
    description: Fail if the overall score (0-100) is below this value. Empty uses the config file or 0.
    default: ""
  exclude:
    description: Space-separated folder names to exclude
    default: ""
  lang:
    description: "Language of the messages: en or es"
    default: en
  baseline:
    description: Baseline file whose findings are hidden, so only new ones fail the build
    default: ""
  diff-base:
    description: "Only report findings on lines changed since this git ref (for example origin/main). Needs fetch-depth: 0."
    default: ""
  comment:
    description: "On pull requests, post the summary as a comment (needs 'pull-requests: write')"
    default: "false"
  sarif-file:
    description: Where to write the SARIF report (upload it with github/codeql-action/upload-sarif)
    default: repocheckup.sarif
  html-file:
    description: Where to write the HTML report
    default: repocheckup-report.html
  badge-file:
    description: Where to write the SVG score badge
    default: repocheckup-badge.svg
outputs:
  score:
    description: Overall score from 0 to 100
    value: ${{ steps.run.outputs.score }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - id: run
      shell: bash
      env:
        RC_PATH: ${{ inputs.path }}
        RC_CHECKS: ${{ inputs.checks }}
        RC_FAIL_ON: ${{ inputs.fail-on }}
        RC_MIN_SCORE: ${{ inputs.min-score }}
        RC_EXCLUDE: ${{ inputs.exclude }}
        RC_LANG: ${{ inputs.lang }}
        RC_BASELINE: ${{ inputs.baseline }}
        RC_DIFF: ${{ inputs.diff-base }}
        RC_COMMENT: ${{ inputs.comment }}
        RC_SARIF: ${{ inputs.sarif-file }}
        RC_HTML: ${{ inputs.html-file }}
        RC_BADGE: ${{ inputs.badge-file }}
        RC_PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
        PYTHONPATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/scripts/action.sh"
