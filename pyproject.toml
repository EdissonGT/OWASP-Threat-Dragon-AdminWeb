[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repocheckup"
version = "2.0.0"
description = "Security, code quality, repository health and dependency checks with a score and an HTML report. No dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Edisson Payes" }]
keywords = ["security", "appsec", "sast", "code-quality", "linter", "devsecops", "owasp", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/EdissonGT/repocheckup"

[project.scripts]
repocheckup = "repocheckup.__main__:main"

[tool.setuptools]
packages = ["repocheckup"]
