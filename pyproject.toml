[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-scan"
version = "1.0.0"
description = "Analizador estático ligero de patrones inseguros y guía de buenas prácticas de seguridad de aplicaciones"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Edisson Payes" }]
keywords = ["security", "appsec", "owasp", "static-analysis", "sast"]

[project.scripts]
appsec-scan = "appsec_scan.__main__:main"

[tool.setuptools]
packages = ["appsec_scan"]
